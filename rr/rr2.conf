frr defaults traditional
hostname rr2
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.102/32
!
interface eth1
 ip address 10.2.12.1/31
!
interface eth2
 ip address 10.2.22.1/31
!
interface eth3
 ip address 10.2.32.1/31
!
interface eth4
 ip address 10.2.42.1/31
!
bfd
 profile FAST
  receive-interval 300
  transmit-interval 300
  detect-multiplier 3
 exit
exit
!
! reach the leaf loopbacks over the direct links (no underlay participation)
ip route 10.0.0.11/32 10.2.12.0
ip route 10.0.0.12/32 10.2.22.0
ip route 10.0.0.13/32 10.2.32.0
ip route 10.0.0.14/32 10.2.42.0
!
! RSC-BGP: route server, multihop eBGP loopback<->loopback to every leaf.
! route-server-client keeps the leaf's AS path and loopback next hop untouched.
router bgp 65500
 bgp router-id 10.0.0.102
 no bgp ebgp-requires-policy
 neighbor LEAF peer-group
 neighbor LEAF ebgp-multihop 2
 neighbor LEAF update-source lo
 neighbor LEAF bfd profile FAST
 neighbor 10.0.0.11 remote-as 65001
 neighbor 10.0.0.11 peer-group LEAF
 neighbor 10.0.0.12 remote-as 65002
 neighbor 10.0.0.12 peer-group LEAF
 neighbor 10.0.0.13 remote-as 65003
 neighbor 10.0.0.13 peer-group LEAF
 neighbor 10.0.0.14 remote-as 65004
 neighbor 10.0.0.14 peer-group LEAF
 !
 address-family ipv4 unicast
  neighbor LEAF route-server-client
  neighbor LEAF attribute-unchanged next-hop
 exit-address-family
!
